# .goreleaser.yaml
version: 2

# Désactivez la construction automatique des releases
builds:
  - skip: true

# Configuration Docker uniquement
dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:{{ .Tag }}"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

# Désactivez les checksums
checksum:
  disable: true

# Désactivez le changelog automatique
changelog:
  disable: true

# Configuration minimale pour la release GitHub
release:
  draft: true
  replace_existing_draft: true