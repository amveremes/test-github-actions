# .goreleaser.yaml
version: 2

# Désactivez la construction automatique des releases
builds:
  - skip: true  # On ne construit rien, on utilise seulement Docker

# Configuration Docker uniquement
dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:latest"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/{{ .ProjectName }}:{{ .Tag }}"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

# Désactivez les archives
archives:
  - format: binary
    disabled: true

# Désactivez les checksums
checksum:
  disable: true

# Désactivez le changelog automatique
changelog:
  disable: true

# Configuration minimale pour la release GitHub
release:
  github:
    owner: "{{ .Env.GITHUB_REPOSITORY_OWNER }}"
    name: "{{ .ProjectName }}"
  # Désactivez l'upload d'artefacts
  draft: true  # Crée une release en brouillon sans artefacts
  replace_existing_draft: true